name = "spiritual-gym"
main = "./src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]

# --- D1 database (users, sessions, check-ins, journeys, workouts, journal, prayer, scripture memory) ---
# Create with:  npx wrangler d1 create spiritual_gym_db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "spiritual_gym_db"
database_id = "931dd191-fd07-46a9-992c-1e3edc9aa598"
migrations_dir = "migrations"

# --- R2 bucket (avatars, journey cover images, audio later) ---
# Create with:  npx wrangler r2 bucket create spiritual-gym-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "spiritual-gym-media"

# --- Durable Object: live group prayer rooms (free plan uses SQLite-backed classes) ---
[[durable_objects.bindings]]
name = "PRAYER_ROOMS"
class_name = "PrayerRoom"

[[durable_objects.bindings]]
name = "PUSH"
class_name = "PushDispatcher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PrayerRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PushDispatcher"]

# --- Every 5 minutes: prayer-time reminders + daily reminders ---
[triggers]
crons = ["*/5 * * * *"]

# --- Secrets: set with `npx wrangler secret put <NAME>`, never commit them ---
# RESEND_API_KEY        password reset + reminder emails   (Phase 2)
# AI_API_KEY            Spiritual Coach                    (Phase 5)
# TURN_KEY_ID / TURN_KEY_API_TOKEN   optional Cloudflare Realtime TURN key, helps live prayer on strict mobile networks

[vars]
SITE_ENV = "production"
# Push notifications: run `node scripts/vapid.mjs`, paste the public key here, and save the private key as a secret
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:admin@example.com"
